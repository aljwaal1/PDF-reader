<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PDF Reader">
  <title>PDF Reader</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root{color-scheme:light dark;--bg:#f7f7fb;--card:#fff;--text:#171717;--muted:#6b7280;--accent:#4f46e5;--line:#e5e7eb}
    @media(prefers-color-scheme:dark){:root{--bg:#111318;--card:#191c22;--text:#f5f5f5;--muted:#a5adbb;--line:#2b3038}}
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
    header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:max(12px,env(safe-area-inset-top)) 14px 12px;display:flex;align-items:center;gap:10px;justify-content:space-between}
    h1{font-size:18px;margin:0}.status{font-size:12px;color:var(--muted)}main{padding:14px 14px calc(94px + env(safe-area-inset-bottom));max-width:1100px;margin:auto}
    .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.btn,select,input[type=file]::file-selector-button{border:0;border-radius:12px;padding:11px 14px;font-size:15px;background:var(--card);color:var(--text);box-shadow:0 0 0 1px var(--line) inset}.primary{background:var(--accent);color:#fff;box-shadow:none}.btn:disabled{opacity:.45}
    .layout{display:grid;grid-template-columns:1fr;gap:12px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0}.panel-title{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
    #pdfWrap{display:flex;justify-content:center;align-items:flex-start;min-height:380px;padding:10px;overflow:auto}canvas{max-width:100%;height:auto;box-shadow:0 6px 22px rgba(0,0,0,.12)}
    #translation{white-space:pre-wrap;line-height:1.9;font-size:18px;padding:18px;min-height:180px;direction:rtl;text-align:right}.hidden{display:none!important}.side{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
    .bottom{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
    .bottom .btn{min-height:44px}.page{min-width:86px;text-align:center;font-variant-numeric:tabular-nums}
    @media(max-width:720px){.side{grid-template-columns:1fr}.toolbar{gap:7px}.btn{padding:10px 11px}}
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.8.69/pdf.min.mjs" type="module"></script>
</head>
<body>
<header><div><h1>PDF Reader</h1><div class="status" id="status">افتح كتاب PDF للبدء</div></div><button class="btn" id="installBtn" hidden>تثبيت</button></header>
<main>
  <div class="toolbar">
    <input id="file" type="file" accept="application/pdf">
    <button class="btn" id="speakBtn" disabled>🔊 قراءة الصفحة</button>
    <button class="btn primary" id="translateBtn" disabled>🌐 ترجمة</button>
    <select id="layoutSelect" aria-label="طريقة عرض الترجمة">
      <option value="pdf">PDF فقط</option><option value="translation">الترجمة فقط</option><option value="below" selected>الترجمة أسفل الصفحة</option><option value="side">جنبًا إلى جنب</option>
    </select>
    <select id="rateSelect" aria-label="سرعة القراءة"><option value="0.75">0.75x</option><option value="1" selected>1.0x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option></select>
  </div>
  <div id="layout" class="layout">
    <section id="pdfPanel" class="panel"><div class="panel-title">الصفحة الأصلية</div><div id="pdfWrap"><div class="status">لم يتم اختيار كتاب بعد.</div></div></section>
    <section id="translationPanel" class="panel"><div class="panel-title">الترجمة العربية</div><div id="translation">اضغط «ترجمة» بعد فتح الكتاب.</div></section>
  </div>
</main>
<nav class="bottom"><button class="btn" id="prevBtn" disabled>السابق</button><div class="btn page" id="pageLabel">0 / 0</div><button class="btn" id="nextBtn" disabled>التالي</button></nav>
<script type="module">
  import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.8.69/pdf.min.mjs';
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.8.69/pdf.worker.min.mjs';
  const $=id=>document.getElementById(id); let pdf=null,page=1,text='',speaking=false,deferredPrompt=null; const translations=new Map();
  async function render(){ if(!pdf)return; const p=await pdf.getPage(page); const viewport=p.getViewport({scale:1.55}); const canvas=document.createElement('canvas'); const ctx=canvas.getContext('2d'); canvas.width=viewport.width; canvas.height=viewport.height; $('pdfWrap').replaceChildren(canvas); await p.render({canvasContext:ctx,viewport}).promise; const tc=await p.getTextContent(); text=tc.items.map(x=>x.str).join(' ').replace(/\s+/g,' ').trim(); $('pageLabel').textContent=`${page} / ${pdf.numPages}`; $('prevBtn').disabled=page<=1; $('nextBtn').disabled=page>=pdf.numPages; $('speakBtn').disabled=!text; $('translateBtn').disabled=!text; $('translation').textContent=translations.get(page)||'اضغط «ترجمة» لترجمة الصفحة الحالية.'; $('status').textContent=`الصفحة ${page} من ${pdf.numPages}`; localStorage.setItem('lastPage',String(page)); }
  $('file').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return; const buf=await f.arrayBuffer(); pdf=await pdfjsLib.getDocument({data:buf}).promise; page=Math.min(Number(localStorage.getItem('lastPage'))||1,pdf.numPages); translations.clear(); await render();});
  $('prevBtn').addEventListener('click',async()=>{if(page>1){page--;speechSynthesis.cancel();await render();}}); $('nextBtn').addEventListener('click',async()=>{if(pdf&&page<pdf.numPages){page++;speechSynthesis.cancel();await render();}});
  $('speakBtn').addEventListener('click',()=>{if(!text)return;if(speaking){speechSynthesis.cancel();speaking=false;$('speakBtn').textContent='🔊 قراءة الصفحة';return;}const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=Number($('rateSelect').value);u.onend=()=>{speaking=false;$('speakBtn').textContent='🔊 قراءة الصفحة'};speaking=true;$('speakBtn').textContent='⏹ إيقاف';speechSynthesis.cancel();speechSynthesis.speak(u);});
  async function translateChunk(q){const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)+'&langpair=en|ar';const r=await fetch(url);if(!r.ok)throw new Error('translation');const j=await r.json();return j.responseData?.translatedText||''}
  $('translateBtn').addEventListener('click',async()=>{if(!text)return;if(translations.has(page)){$('translation').textContent=translations.get(page);return;}$('translateBtn').disabled=true;$('translation').textContent='جارٍ الترجمة…';try{const chunks=text.match(/.{1,900}(?:\s|$)/g)||[text];const out=[];for(const c of chunks)out.push(await translateChunk(c.trim()));const result=out.join('\n');translations.set(page,result);$('translation').textContent=result;}catch(e){$('translation').textContent='تعذر الاتصال بخدمة الترجمة الآن. حاول مرة أخرى.';}finally{$('translateBtn').disabled=false;}});
  $('layoutSelect').addEventListener('change',()=>{const v=$('layoutSelect').value;$('layout').className='layout'+(v==='side'?' side':'');$('pdfPanel').classList.toggle('hidden',v==='translation');$('translationPanel').classList.toggle('hidden',v==='pdf');localStorage.setItem('layout',v)}); const saved=localStorage.getItem('layout');if(saved){$('layoutSelect').value=saved;$('layoutSelect').dispatchEvent(new Event('change'));}
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('installBtn').hidden=false});$('installBtn').addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('installBtn').hidden=true});
  if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body></html>
