name: Mobile Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate platform projects
        run: flutter create . --platforms=android,ios --project-name pdf_reader
      - name: Apply Android 8 compatibility fixes
        run: python3 tool/android8_compat_patch.py
      - name: Apply focused modern Android UI
        run: python3 tool/android_modern_ui_patch.py
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --debug
      - name: Prepare direct-download APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk PDF-Reader.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-reader-android-debug
          path: PDF-Reader.apk
      - name: Publish stable Android download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view android-latest >/dev/null 2>&1; then
            gh release create android-latest PDF-Reader.apk \
              --title "PDF Reader - Latest Android" \
              --notes "Latest tested Android build. Updated automatically after a successful build." \
              --latest
          else
            gh release upload android-latest PDF-Reader.apk --clobber
            gh release edit android-latest --latest
          fi

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate platform projects
        run: flutter create . --platforms=android,ios --project-name pdf_reader
      - run: flutter pub get
      - run: flutter analyze
      - name: Build iOS without code signing
        run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-reader-ios-unsigned
          path: build/ios/iphoneos/Runner.app
