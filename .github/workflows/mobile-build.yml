name: Mobile Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Clean source build: analyze, test, then publish the Android release APK.
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate platform projects
        run: flutter create . --platforms=android,ios --project-name pdf_reader
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - name: Prepare direct-download APK
        run: cp build/app/outputs/flutter-apk/app-release.apk PDF-Reader.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-reader-android-release
          path: PDF-Reader.apk
      - name: Publish stable Android download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view android-latest >/dev/null 2>&1; then
            gh release create android-latest PDF-Reader.apk \
              --title "PDF Reader - Latest Android" \
              --notes "Latest tested Android release build. Updated automatically after a successful build." \
              --latest
          else
            gh release upload android-latest PDF-Reader.apk --clobber
            gh release edit android-latest --latest
          fi

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate platform projects
        run: flutter create . --platforms=android,ios --project-name pdf_reader
      - name: Set iOS 15.5 deployment target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          podfile = Path('ios/Podfile')
          text = podfile.read_text(encoding='utf-8')
          lines = text.splitlines()
          replaced = False
          for i, line in enumerate(lines):
              if line.strip().startswith('platform :ios') or line.strip().startswith('# platform :ios'):
                  lines[i] = "platform :ios, '15.5'"
                  replaced = True
                  break
          if not replaced:
              lines.insert(0, "platform :ios, '15.5'")
          podfile.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          project = Path('ios/Runner.xcodeproj/project.pbxproj')
          p = project.read_text(encoding='utf-8')
          p = re.sub(r'IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;', 'IPHONEOS_DEPLOYMENT_TARGET = 15.5;', p)
          project.write_text(p, encoding='utf-8')

          plist = Path('ios/Flutter/AppFrameworkInfo.plist')
          q = plist.read_text(encoding='utf-8')
          q = re.sub(r'(<key>MinimumOSVersion</key>\s*<string>)[^<]+(</string>)', r'\g<1>15.5\2', q)
          plist.write_text(q, encoding='utf-8')
          PY
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build iOS without code signing
        run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-reader-ios-unsigned
          path: build/ios/iphoneos/Runner.app
