name: Apply PWA HiDPI Fix

on:
  push:
    branches: [main]
    paths:
      - 'tool/pwa_hidpi_patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply high-DPI PDF rendering patch
        run: python3 tool/pwa_hidpi_patch.py
      - name: Commit PWA quality update
        run: |
          if git diff --quiet -- pwa/index.html pwa/sw.js; then
            echo "No PWA changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pwa/index.html pwa/sw.js
          git commit -m "Improve PWA PDF clarity on HiDPI phones"
          git push
