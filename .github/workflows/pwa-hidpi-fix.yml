name: Reader HUD Update

on:
  push:
    branches: [main]
    paths:
      - 'tool/reading_hud_patch.py'
      - '.github/workflows/pwa-hidpi-fix.yml'

permissions:
  contents: write

jobs:
  update-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixed reading HUD
        run: python3 tool/reading_hud_patch.py
      - name: Remove obsolete transcript references
        run: sed -i "/_showTranscript/d" lib/main.dart
      - name: Validate PWA JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('pwa/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', text, flags=re.S)
          if not scripts:
              raise SystemExit('No inline PWA script found')
          Path('/tmp/pwa-reader.mjs').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/pwa-reader.mjs
      - name: Validate reader HUD invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          dart = Path('lib/main.dart').read_text(encoding='utf-8')
          pwa = Path('pwa/index.html').read_text(encoding='utf-8')
          checks = {
              'Android speech lifecycle': '_speechRunToken' in dart,
              'Android fixed HUD': 'Positioned(left: 8, right: 8, bottom: 8, child: _readingCard())' in dart,
              'Android current word chip': "const Expanded(child: Text('القراءة الآن'" in dart,
              'Android compact text': 'maxLines: 2' in dart,
              'PWA fixed HUD': 'id="readingHud"' in pwa,
              'PWA current word': 'id="hudWord"' in pwa,
              'PWA live HUD update': 'updateReadingHud(state.offset)' in pwa,
              'No obsolete transcript references': '_showTranscript' not in dart,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Missing HUD invariants: ' + ', '.join(failed))
          print('Reading HUD invariants validated')
          PY
      - name: Commit HUD source changes
        run: |
          if git diff --quiet -- lib/main.dart pwa/index.html pwa/sw.js; then
            echo "No HUD source changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart pwa/index.html pwa/sw.js
          git commit -m "Fix fixed reading HUD build"
          git push
