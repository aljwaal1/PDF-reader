name: Apply Reader Audit Fixes

on:
  push:
    branches: [main]
    paths:
      - 'tool/release_audit_fix.py'
      - '.github/workflows/pwa-hidpi-fix.yml'

permissions:
  contents: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply audited reader fixes
        run: python3 tool/release_audit_fix.py
      - name: Validate PWA JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('pwa/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', text, flags=re.S)
          if not scripts:
              raise SystemExit('No inline PWA script found')
          Path('/tmp/pwa-reader.mjs').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/pwa-reader.mjs
      - name: Commit audited reader source
        run: |
          if git diff --quiet -- lib/main.dart; then
            echo "No audited source changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git commit -m "Harden reader lifecycle and translation logic"
          git push
