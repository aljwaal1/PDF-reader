name: Reader Validation

on:
  push:
    branches: [main]
    paths:
      - 'lib/main.dart'
      - 'pwa/index.html'
      - 'pwa/sw.js'
      - 'tool/reading_hud_patch.py'
      - '.github/workflows/pwa-hidpi-fix.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixed reading HUD
        if: contains(github.event.head_commit.modified, 'tool/reading_hud_patch.py') || contains(github.event.head_commit.added, 'tool/reading_hud_patch.py') || contains(github.event.head_commit.modified, '.github/workflows/pwa-hidpi-fix.yml')
        run: python3 tool/reading_hud_patch.py
      - name: Validate PWA JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('pwa/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', text, flags=re.S)
          if not scripts:
              raise SystemExit('No inline PWA script found')
          Path('/tmp/pwa-reader.mjs').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/pwa-reader.mjs
      - name: Validate reader invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          dart = Path('lib/main.dart').read_text(encoding='utf-8')
          pwa = Path('pwa/index.html').read_text(encoding='utf-8')
          checks = {
              'Android speech run token': '_speechRunToken' in dart,
              'Android page-bound translation': 'final targetPage = _page;' in dart,
              'Android auto next': '_autoNext' in dart,
              'Android fixed reading HUD': 'Positioned(left: 8, right: 8, bottom: 8, child: _readingCard())' in dart,
              'Android compact sentence': 'maxLines: 2' in dart,
              'PWA translation queue': 'translationQueue' in pwa,
              'PWA reading position': 'readingPositionKey' in pwa,
              'PWA auto next': 'autoNext' in pwa,
              'PWA fixed reading HUD': 'id="readingHud"' in pwa and 'updateReadingHud' in pwa,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Missing reader invariants: ' + ', '.join(failed))
          if dart.count('_saveTranslation(_page, translated);') > 1:
              raise SystemExit('Duplicate Android translation save detected')
          print('Reader invariants validated')
          PY
      - name: Commit HUD source changes
        run: |
          if git diff --quiet -- lib/main.dart pwa/index.html pwa/sw.js; then
            echo "No HUD source changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart pwa/index.html pwa/sw.js
          git commit -m "Keep current reading and translation visible"
          git push
